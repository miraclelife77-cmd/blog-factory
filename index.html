<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOG FACTORY</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f7f5;color:#182019}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#12351f;color:#fff;padding:24px 16px}aside h1{font-size:21px;margin:0 8px 6px}.sub{font-size:12px;opacity:.7;margin:0 8px 22px}.nav button{width:100%;border:0;background:none;color:#dce9df;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#28603c}main{padding:28px;max-width:1200px;width:100%}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.card{background:#fff;border:1px solid #dfe7df;border-radius:14px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.three{grid-template-columns:repeat(3,1fr)}label{font-size:13px;font-weight:bold;display:block;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd6cd;border-radius:8px;padding:10px}textarea{min-height:100px;resize:vertical}.body{min-height:320px}#aiPrompt{min-height:220px}.btn{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#e7eee9;font-weight:bold}.primary{background:#166534;color:#fff}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.topic{border:1px solid #dfe7df;border-radius:10px;padding:13px;cursor:pointer}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;border:0}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.no{background:#fee2e2;color:#991b1b}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e3e9e4;text-align:left}.muted{color:#68746b;font-size:13px}.metric{font-size:28px;font-weight:bold}@media(max-width:760px){.app{display:block}aside{padding:12px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.sub{display:none}main{padding:14px}.grid,.three,.topics{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside><h1>BLOG FACTORY</h1><p class="sub">콘텐츠를 만들고 검증하고 기록합니다.</p><div class="nav"><button class="active" data-p="today">오늘의 글</button><button data-p="calendar">콘텐츠 캘린더</button><button data-p="verify">검증노트</button><button data-p="archive">자료실</button><button data-p="stats">성과</button><button data-p="settings">설정</button></div></aside><main>
<section id="today" class="page active"><div class="head"><div><h2>오늘의 글</h2><div class="muted">AI 프롬프트부터 네이버 게시 직전 원고까지 관리합니다.</div></div><button class="btn primary" onclick="suggest()">주제 3개 추천</button></div><div class="card"><b>오늘의 주제 후보</b><div id="topics" class="topics"></div></div><div class="grid"><div class="card"><label>콘텐츠 프로젝트</label><select id="project"><option>일반 / 생각과 기록</option><option>AI와 기술</option><option>환경과 탄소</option><option>왕대나무 프로젝트</option><option>사업 탐구</option><option>현장 기록</option></select><label>주제</label><input id="topic"><label>검증 수준</label><select id="level"><option>일반 콘텐츠</option><option>확인된 사실 중심</option><option>검증 중 - 출처/귀속 표현 필수</option></select><div class="actions"><button class="btn" onclick="makePrompt()">ChatGPT용 프롬프트 만들기</button><button class="btn" onclick="copyText(document.getElementById('aiPrompt').value)">프롬프트 복사</button></div><label>AI 작성 프롬프트</label><textarea id="aiPrompt"></textarea></div><div class="card"><label>제목</label><input id="title"><label>썸네일 문구</label><input id="thumb"><label>해시태그</label><textarea id="tags"></textarea><label>게시 URL</label><input id="url"></div></div><div class="card"><label>본문</label><textarea id="content" class="body"></textarea><div class="actions"><button class="btn" onclick="copyArticle()">네이버용 복사</button><button class="btn" onclick="savePost(false)">초안 저장</button><button class="btn primary" onclick="savePost(true)">게시 완료</button><button class="btn" onclick="clearEditor()">새 글</button></div></div></section>
<section id="calendar" class="page"><div class="head"><h2>콘텐츠 캘린더</h2></div><div class="card"><table><thead><tr><th>날짜</th><th>프로젝트</th><th>제목</th><th>상태</th><th></th></tr></thead><tbody id="records"></tbody></table></div></section>
<section id="verify" class="page"><div class="head"><h2>왕대나무 · ESG 검증노트</h2></div><div class="card"><p class="muted">확인 = 사실 표현 가능 / 검증 중 = 회사 주장 등 귀속 표현 / 미확인 = 사실 단정 금지</p><table><thead><tr><th>항목</th><th>상태</th><th>메모</th></tr></thead><tbody id="verifyRows"></tbody></table><div class="actions"><button class="btn" onclick="addVerify()">검증항목 추가</button></div></div></section>
<section id="archive" class="page"><div class="head"><h2>자료실</h2></div><div class="card"><label>조사 메모 / 출처 / 다음 확인사항</label><textarea id="archiveText" class="body" oninput="saveArchive()"></textarea></div></section>
<section id="stats" class="page"><div class="head"><h2>성과</h2></div><div class="grid three"><div class="card"><div class="muted">누적 콘텐츠</div><div class="metric" id="mTotal">0</div></div><div class="card"><div class="muted">게시 완료</div><div class="metric" id="mPublished">0</div></div><div class="card"><div class="muted">총 조회수</div><div class="metric" id="mViews">0</div></div></div><div class="card"><label>총 조회수 직접 입력</label><input id="views" type="number" oninput="saveViews()"></div></section>
<section id="settings" class="page"><div class="head"><h2>설정</h2></div><div class="grid"><div class="card"><label>블로그 ID</label><input id="blogId"><label>블로그 정체성</label><textarea id="identity"></textarea><label>기본 글 길이</label><select id="length"><option>1200~1800자</option><option>1800~2500자</option><option>2500자 이상</option></select><label>사업 콘텐츠 빈도</label><select id="freq"><option>주 1~2회</option><option>주 1회</option><option>주 2회</option></select><div class="actions"><button class="btn primary" onclick="saveSettings()">설정 저장</button></div></div><div class="card"><b>데이터 백업</b><p class="muted">v1 데이터는 현재 브라우저에 저장됩니다.</p><div class="actions"><button class="btn" onclick="exportData()">JSON 백업</button><label class="btn" style="display:inline-block;margin:0">백업 복원<input type="file" accept=".json" hidden onchange="importData(this)"></label></div></div></div></section>
</main></div><script src="app.js"></script></body></html>
